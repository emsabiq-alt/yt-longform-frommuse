name: YT Speech Pacing Preview

on:
  workflow_dispatch:
    inputs:
      tts_voice:
        description: Optional voice override for both samples
        required: false
        default: ""

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
      OPENAI_TTS_MODEL: ${{ secrets.OPENAI_TTS_MODEL || 'gpt-4o-mini-tts' }}
      OPENAI_TTS_VOICE: ${{ inputs.tts_voice || secrets.OPENAI_TTS_VOICE || 'fable' }}
      OPENAI_TTS_INSTRUCTIONS: ${{ secrets.OPENAI_TTS_INSTRUCTIONS || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Ensure FFprobe is available
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Generate matching speech samples
        run: npm run preview:speech
      - name: Save audio comparison
        uses: actions/upload-artifact@v4
        with:
          name: speech-pacing-preview
          path: generated/audio/pacing-preview/
          if-no-files-found: error
          retention-days: 7
